<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="올림픽공원 공연 관객이 야외에서 기다리는 시간의 폭염·한파 위험을 미리 알려 주는 서비스" />
    <meta name="theme-color" content="#1d1b2e" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236a3de8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 8a2 2 0 0 0 0 4 2 2 0 0 1 0 4v1.5A1.5 1.5 0 0 0 4.5 19h15a1.5 1.5 0 0 0 1.5-1.5V16a2 2 0 0 1 0-4 2 2 0 0 0 0-4V6.5A1.5 1.5 0 0 0 19.5 5h-15A1.5 1.5 0 0 0 3 6.5Z'/><path d='M15 5v14' stroke-dasharray='2 2.5'/></svg>" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <title>큐캐스트 QueueCast</title>
  </head>
  <body>
    <a class="skip-link" href="#app">본문 바로가기</a>
    <header class="site-header">
      <div class="wrap header-inner">
        <a href="#/" class="logo" aria-label="큐캐스트 처음으로">
          <svg class="logo-mark" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 0 0 4 2 2 0 0 1 0 4v1.5A1.5 1.5 0 0 0 4.5 19h15a1.5 1.5 0 0 0 1.5-1.5V16a2 2 0 0 1 0-4 2 2 0 0 0 0-4V6.5A1.5 1.5 0 0 0 19.5 5h-15A1.5 1.5 0 0 0 3 6.5Z"/><path d="M15 5v14" stroke-dasharray="2 2.5"/></svg>
          <span class="logo-text"><strong data-i18n="brand">큐캐스트</strong><small data-i18n="brand.sub">올림픽공원 공연 대기 안전 예보</small></span>
        </a>
        <nav class="main-nav" id="main-nav" aria-label="주 메뉴">
          <a href="#/" data-nav="forecast" data-i18n="nav.forecast">공연 예보</a>
          <a href="#/ops" data-nav="ops" data-i18n="nav.ops">공단·주최사</a>
          <a href="#/replay" data-nav="replay" data-i18n="nav.replay">2025 사례</a>
          <a href="#/about" data-nav="about" data-i18n="nav.about">서비스 소개</a>
          <button type="button" class="lang-toggle" data-lang-toggle>English</button>
        </nav>
        <button type="button" class="menu-btn" aria-controls="main-nav" aria-expanded="false" aria-label="메뉴 열기">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <main id="app" class="wrap" tabindex="-1"></main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <div class="f-brand">
          <span class="f-logo"><strong data-i18n="brand">큐캐스트</strong> QueueCast</span>
          <p data-i18n="footer.about">올림픽공원 공연 관객이 야외에서 기다리는 시간의 폭염·한파 위험을 3일 전부터 알려 드려요.</p>
        </div>
        <nav class="f-links" aria-label="바닥글 메뉴">
          <a href="#/about" data-i18n="nav.about">서비스 소개</a>
          <a href="#/about/levels" data-i18n="footer.levels">위험 단계 기준</a>
          <a href="#/about/data" data-i18n="footer.data">데이터 출처</a>
        </nav>
        <div class="f-side">
          <p class="f-partners-label" data-i18n="footer.partners">데이터 제공</p>
          <ul class="f-partners">
            <li>기상청</li><li>KOPIS</li><li>국민체육진흥공단</li><li>한국체육산업개발</li>
          </ul>
          <a class="f-gh" href="https://github.com/sseii/queuecast" target="_blank" rel="noopener" aria-label="GitHub">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
          </a>
        </div>
        <div class="f-meta">
          <p id="sources"></p>
          <p id="privacy" data-i18n="footer.privacy">큐캐스트는 개인정보를 수집하지 않아요. 체크 표시와 언어 선택은 이 기기의 브라우저에만 저장돼요.</p>
          <p id="credit"></p>
        </div>
      </div>
    </footer>
    <button type="button" class="to-top" aria-label="맨 위로" data-to-top>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
